plugins {
    id 'com.android.application'
}

def releasePropsFile = rootProject.file('keys/release.properties')
def releaseProps = new Properties()
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

android {
    namespace 'com.albertolicea.smsexporter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.albertolicea.smsexporter'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // the app only ships English and Spanish; drop the other locales bundled in Material/AppCompat
        resourceConfigurations += ['en', 'es']
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keys/release.jks')
            storePassword releaseProps.getProperty('storePassword')
            keyAlias releaseProps.getProperty('keyAlias', 'albertolicea00')
            keyPassword releaseProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "sms-exporter-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
