plugins {
    id 'com.android.application'
}

def releasePropsFile = rootProject.file('keys/release.properties')
def releaseProps = new Properties()
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

android {
    namespace 'com.albertolicea.smsexporter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.albertolicea.smsexporter'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
        // the app only ships English and Spanish; drop the other locales bundled in Material/AppCompat
        resourceConfigurations += ['en', 'es']
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keys/release.jks')
            storePassword releaseProps.getProperty('storePassword')
            keyAlias releaseProps.getProperty('keyAlias', 'albertolicea00')
            keyPassword releaseProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "sms-exporter-v${variant.versionName}.apk"
        }
        variant.assembleProvider.get().doLast {
            variant.outputs.all { output ->
                def apkFile = output.outputFile
                if (apkFile.exists()) {
                    def sha256 = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(apkFile.bytes)
                        .collect { String.format('%02x', it) }
                        .join()
                    new File(apkFile.parentFile, "${apkFile.name}.sha256")
                        .text = "${sha256}  ${apkFile.name}\n"
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
